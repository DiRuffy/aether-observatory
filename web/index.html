<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Aether Observatory — Interactive real-time 3D celestial forge powered by Flutter Scene (PBR, custom GLSL shaders, dynamic shadows, instancing, particles & cinematic post-processing).">
  <meta name="theme-color" content="#05070d">

  <!-- Open Graph / Social -->
  <meta property="og:title" content="Aether Observatory — Flutter Scene 3D Showcase">
  <meta property="og:description" content="Real-time 3D PBR sanctuary with kinetic astrolabe, custom GLSL plasma core, dynamic shadows, particles, and cinematic post-processing built with Flutter Scene.">
  <meta property="og:type" content="website">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Aether Observatory">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Aether Observatory — Flutter Scene 3D</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 42%, #10172b 0%, #05070d 72%);
      color: #e6edf7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    }

    #aether-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 9999;
      pointer-events: none;
      transition: opacity 0.65s cubic-bezier(0.22, 1, 0.36, 1);
    }

    #aether-loader.hidden {
      opacity: 0;
    }

    .orbital-loader {
      position: relative;
      width: 72px;
      height: 72px;
    }

    .orbital-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1.5px solid transparent;
      border-top-color: #f6c46d;
      border-right-color: rgba(246, 196, 109, 0.35);
      animation: spin 1.6s linear infinite;
    }

    .orbital-ring:nth-child(2) {
      inset: 10px;
      border-top-color: #62e3ff;
      border-right-color: rgba(98, 227, 255, 0.35);
      animation: spin-rev 1.15s linear infinite;
    }

    .orbital-core {
      position: absolute;
      inset: 27px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffffff 0%, #7cebff 48%, rgba(98, 227, 255, 0) 100%);
      box-shadow: 0 0 22px rgba(124, 235, 255, 0.85);
      animation: pulse 1.8s ease-in-out infinite;
    }

    .loader-title {
      font-size: 13px;
      letter-spacing: 0.34em;
      text-transform: uppercase;
      color: rgba(230, 237, 247, 0.9);
      font-weight: 500;
    }

    .loader-sub {
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(154, 174, 206, 0.62);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes spin-rev {
      to { transform: rotate(-360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(0.85); opacity: 0.85; }
      50% { transform: scale(1.18); opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="aether-loader">
    <div class="orbital-loader">
      <div class="orbital-ring"></div>
      <div class="orbital-ring"></div>
      <div class="orbital-core"></div>
    </div>
    <div class="loader-title">Aether Observatory</div>
    <div class="loader-sub">Initializing Flutter Scene WebGL2 Engine</div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('aether-loader');
      if (loader) {
        loader.classList.add('hidden');
        setTimeout(function () { loader.remove(); }, 700);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
